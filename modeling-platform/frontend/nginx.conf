server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /proxy-osm/ {
    proxy_pass https://api.openstreetmap.org/;
    proxy_set_header Host api.openstreetmap.org;
    proxy_set_header User-Agent "modeling-platform/1.0";
  }

  location /proxy-nominatim/ {
    proxy_pass https://nominatim.openstreetmap.org/;
    proxy_set_header Host nominatim.openstreetmap.org;
    proxy_set_header User-Agent "modeling-platform/1.0";
  }
}
